name: check
on: [push, pull_request]
jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fails if any port is out of date with palette/flavors.mjs,
      # or if a text role drops below WCAG AA contrast.
      - name: Check generated ports and palette contrast
        run: pnpm run check
      - name: Test scoped npm package contents and imports
        run: pnpm run test:packages
      - name: Run the test suite
        run: pnpm test
