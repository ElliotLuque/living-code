# Manual only. Publishes the extension in extras/vscode to the VS Code Marketplace and Open VSX.
# Needs the repository secrets VSCE_PAT and OVSX_PAT. See docs/PUBLISHING.md for the one-time setup.
name: publish-vscode
on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true
      open-vsx:
        description: Publish to Open VSX
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
      - name: Package the extension
        run: pnpm run package:vscode
      - name: Publish to the VS Code Marketplace
        if: inputs.marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT secret is empty. Add an Azure DevOps token with the Marketplace > Manage scope as a repository secret named VSCE_PAT."
            exit 1
          fi
          pnpm dlx @vscode/vsce publish --packagePath dist/vscode/*.vsix
      - name: Publish to Open VSX
        if: inputs.open-vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The OVSX_PAT secret is empty. Create an open-vsx.org access token and add it as a repository secret named OVSX_PAT."
            exit 1
          fi
          pnpm dlx ovsx publish dist/vscode/*.vsix
