set -g status-style "bg=#020405,fg=#9ba0a2"
set -g status-left-length 40
set -g status-left "#[bg=#00a692,fg=#05080b,bold] #S #[default] "
set -g status-right "#[fg=#747c80]%H:%M #[bg=#12171a,fg=#e2e9ee] #h "
set -g window-status-format "#[fg=#9ba0a2] #I #W "
set -g window-status-current-format "#[bg=#12171a,fg=#00a692,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#1d2226"
set -g pane-active-border-style "fg=#00a692"
set -g message-style "bg=#12171a,fg=#e2e9ee"
set -g message-command-style "bg=#12171a,fg=#00a692"
set -g mode-style "bg=#2d3438,fg=#e2e9ee"
set -g display-panes-active-colour "#00a692"
set -g display-panes-colour "#9ba0a2"
set -g clock-mode-colour "#00a692"
setw -g window-status-bell-style "fg=#efb062,bold"
