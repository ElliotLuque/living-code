# Living Code Frost: https://github.com/ElliotLuque/living-code
filekinds:
  normal:
    foreground: "#e2e9ee"
  directory:
    foreground: "#43a997"
    is_bold: true
  symlink:
    foreground: "#b6e2df"
  pipe:
    foreground: "#e9c897"
  block_device:
    foreground: "#e9c897"
    is_bold: true
  char_device:
    foreground: "#e9c897"
    is_bold: true
  socket:
    foreground: "#bc9ec6"
  special:
    foreground: "#bc9ec6"
  executable:
    foreground: "#a2cb9d"
    is_bold: true
  mount_point:
    foreground: "#98bacd"
    is_bold: true
perms:
  user_read:
    foreground: "#e9c897"
  user_write:
    foreground: "#d68079"
  user_execute_file:
    foreground: "#a2cb9d"
    is_underline: true
  user_execute_other:
    foreground: "#a2cb9d"
  group_read:
    foreground: "#e9c897"
  group_write:
    foreground: "#d68079"
  group_execute:
    foreground: "#a2cb9d"
  other_read:
    foreground: "#e9c897"
  other_write:
    foreground: "#d68079"
  other_execute:
    foreground: "#a2cb9d"
  special_user_file:
    foreground: "#bc9ec6"
  special_other:
    foreground: "#bc9ec6"
  attribute:
    foreground: "#9ba0a2"
size:
  major:
    foreground: "#9ba0a2"
  minor:
    foreground: "#9ba0a2"
  number_byte:
    foreground: "#a2cb9d"
  number_kilo:
    foreground: "#a2cb9d"
  number_mega:
    foreground: "#e9c897"
  number_giga:
    foreground: "#d49c80"
  number_huge:
    foreground: "#d68079"
  unit_byte:
    foreground: "#9ba0a2"
  unit_kilo:
    foreground: "#9ba0a2"
  unit_mega:
    foreground: "#9ba0a2"
  unit_giga:
    foreground: "#9ba0a2"
  unit_huge:
    foreground: "#9ba0a2"
users:
  user_you:
    foreground: "#e9c897"
  user_root:
    foreground: "#d68079"
  user_other:
    foreground: "#bc9ec6"
  group_yours:
    foreground: "#e9c897"
  group_other:
    foreground: "#9ba0a2"
  group_root:
    foreground: "#d68079"
links:
  normal:
    foreground: "#b6e2df"
  multi_link_file:
    foreground: "#d49c80"
git:
  new:
    foreground: "#a2cb9d"
  modified:
    foreground: "#e9c897"
  deleted:
    foreground: "#d68079"
  renamed:
    foreground: "#98bacd"
  ignored:
    foreground: "#7d8489"
  conflicted:
    foreground: "#d68079"
git_repo:
  branch_main:
    foreground: "#a2cb9d"
  branch_other:
    foreground: "#bc9ec6"
  git_clean:
    foreground: "#a2cb9d"
  git_dirty:
    foreground: "#e9c897"
security_context:
  selinux:
    colon:
      foreground: "#7d8489"
    user:
      foreground: "#98bacd"
    role:
      foreground: "#bc9ec6"
    typ:
      foreground: "#e9c897"
    range:
      foreground: "#9ba0a2"
  none:
    foreground: "#7d8489"
file_type:
  image:
    foreground: "#d49c80"
  video:
    foreground: "#bc9ec6"
  music:
    foreground: "#b6e2df"
  crypto:
    foreground: "#d68079"
  document:
    foreground: "#c8cfd4"
  compressed:
    foreground: "#d68079"
  temp:
    foreground: "#7d8489"
  compiled:
    foreground: "#98bacd"
  build:
    foreground: "#e9c897"
    is_bold: true
  source:
    foreground: "#b6e2df"
punctuation:
  foreground: "#7d8489"
date:
  foreground: "#98bacd"
inode:
  foreground: "#9ba0a2"
blocks:
  foreground: "#9ba0a2"
header:
  foreground: "#c8cfd4"
  is_underline: true
octal:
  foreground: "#d49c80"
flags:
  foreground: "#bc9ec6"
symlink_path:
  foreground: "#b6e2df"
control_char:
  foreground: "#d68079"
broken_symlink:
  foreground: "#d68079"
broken_path_overlay:
  foreground: "#d68079"
  is_underline: true
