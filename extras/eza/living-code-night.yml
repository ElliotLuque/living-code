  image:
    foreground: "#e18c5f"
  video:
    foreground: "#bf91cd"
  music:
    foreground: "#9ae0dd"
  crypto:
    foreground: "#e96560"
  document:
    foreground: "#c8cfd4"
  compressed:
    foreground: "#e96560"
