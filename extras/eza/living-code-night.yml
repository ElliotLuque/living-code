# Living Code Night: https://github.com/ElliotLuque/living-code
filekinds:
  normal:
    foreground: "#e2e9ee"
  directory:
    foreground: "#00a692"
    is_bold: true
  symlink:
    foreground: "#9ae0dd"
  pipe:
    foreground: "#f0be6d"
