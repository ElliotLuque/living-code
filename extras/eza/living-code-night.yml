    foreground: "#8acb83"
    is_bold: true
  mount_point:
    foreground: "#80b6d3"
    is_bold: true
perms:
  user_read:
    foreground: "#f0be6d"
  user_write:
    foreground: "#e96560"
  user_execute_file:
    foreground: "#8acb83"
