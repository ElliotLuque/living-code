    foreground: "#9ba0a2"
  minor:
    foreground: "#9ba0a2"
  number_byte:
    foreground: "#8acb83"
  number_kilo:
    foreground: "#8acb83"
  number_mega:
    foreground: "#f0be6d"
  number_giga:
    foreground: "#e18c5f"
  number_huge:
    foreground: "#e96560"
  unit_byte:
    foreground: "#9ba0a2"
  unit_kilo:
    foreground: "#9ba0a2"
  unit_mega:
    foreground: "#9ba0a2"
  unit_giga:
    foreground: "#9ba0a2"
  unit_huge:
    foreground: "#9ba0a2"
users:
  user_you:
    foreground: "#f0be6d"
  user_root:
    foreground: "#e96560"
  user_other:
    foreground: "#bf91cd"
  group_yours:
    foreground: "#f0be6d"
  group_other:
    foreground: "#9ba0a2"
