    foreground: "#e96560"
links:
  normal:
    foreground: "#9ae0dd"
  multi_link_file:
    foreground: "#e18c5f"
git:
  new:
    foreground: "#8acb83"
  modified:
    foreground: "#f0be6d"
  deleted:
    foreground: "#e96560"
  renamed:
    foreground: "#80b6d3"
  ignored:
    foreground: "#747c80"
  conflicted:
    foreground: "#e96560"
git_repo:
  branch_main:
    foreground: "#8acb83"
  branch_other:
    foreground: "#bf91cd"
  git_clean:
    foreground: "#8acb83"
  git_dirty:
    foreground: "#f0be6d"
security_context:
  selinux:
    colon:
      foreground: "#747c80"
    user:
      foreground: "#80b6d3"
    role:
      foreground: "#bf91cd"
    typ:
      foreground: "#f0be6d"
    range:
      foreground: "#9ba0a2"
